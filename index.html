<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Ulice Bez Zasad</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none;display:none}
  #ui.show{display:block}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:#fff;font-weight:800;letter-spacing:.5px;
    background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);
    transition:background .08s, transform .08s}
  .btn.on{background:rgba(255,255,255,.4);transform:scale(.94)}
  #gas{width:100px;height:100px;font-size:15px;
    right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));
    background:rgba(60,200,90,.28);border-color:rgba(110,240,140,.7)}
  #gas.on{background:rgba(60,200,90,.6)}
  #brake{width:78px;height:78px;font-size:12px;
    right:calc(136px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
    background:rgba(230,60,60,.28);border-color:rgba(255,110,110,.7)}
  #brake.on{background:rgba(230,60,60,.6)}
  #hb{width:66px;height:66px;font-size:11px;
    right:calc(40px + env(safe-area-inset-right));bottom:calc(142px + env(safe-area-inset-bottom))}
  #stick{position:absolute;pointer-events:auto;
    left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));
    width:190px;height:96px;border-radius:48px;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28)}
  #stick:before,#stick:after{content:"◀";position:absolute;top:50%;left:14px;transform:translateY(-50%);
    opacity:.35;font-size:18px}
  #stick:after{content:"▶";left:auto;right:14px}
  #knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;
    border-radius:50%;background:rgba(255,255,255,.38);box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    display:flex;gap:8px;z-index:5}
  .sbtn{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.45);color:#fff;
    font-size:20px;display:flex;align-items:center;justify-content:center}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.45),rgba(0,0,0,.85));z-index:10;text-align:center;padding:20px}
  #start h1{margin:0;font-size:clamp(40px,9vw,84px);line-height:.9;font-weight:900;letter-spacing:2px;
    text-shadow:0 4px 0 #000,0 0 30px rgba(255,170,0,.35)}
  #start h1 span{color:#ffb300}
  #start .sub{opacity:.7;margin:14px 0 22px;font-size:14px;letter-spacing:2px;text-transform:uppercase}
  #play{font-size:22px;font-weight:900;padding:14px 46px;border-radius:14px;border:0;
    background:#ffb300;color:#111;letter-spacing:2px;box-shadow:0 5px 0 #a86f00}
  #play:active{transform:translateY(3px);box-shadow:0 2px 0 #a86f00}
  #hint{max-width:460px;opacity:.75;font-size:13px;line-height:1.5;margin-top:22px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <button class="sbtn" id="muteBtn" aria-label="Dźwięk">🔊</button>
  <button class="sbtn" id="resetBtn" aria-label="Powrót na start">↺</button>
</div>

<div id="ui">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="hb">RĘCZNY</div>
  <div class="btn" id="brake">HAMULEC</div>
  <div class="btn" id="gas">GAZ</div>
</div>

<div id="start">
  <h1>ULICE<br><span>BEZ ZASAD</span></h1>
  <div class="sub">Etap 1 · miasto i jazda</div>
  <button id="play">GRAJ</button>
  <div id="hint"></div>
</div>

<script>
"use strict";
// ================== USTAWIENIA ==================
const T = 48;          // rozmiar kafla (px świata)
const P = 14;          // okres siatki: 3 kafle drogi + 11 kafli kwartału
const NB = 7;          // liczba kwartałów w każdą stronę
const MT = NB * P + 3; // rozmiar mapy w kaflach
const WORLD = MT * T;  // rozmiar świata w px

const MAXF = 560, ACC = 430, BRAKE = 950, REV = 230, MAXREV = 190;

// ================== LOSOWANIE (stałe miasto) ==================
let seed = 20261016;
function rnd(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a, b){ return a + rnd() * (b - a); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function shade(hex, amt){
  let n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = c => clamp(Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt), 0, 255);
  return "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")";
}

// ================== GENEROWANIE MIASTA ==================
const G_ROAD = 0, G_WALK = 1, G_GRASS = 2, G_CONC = 3, G_LOT = 4;
const ground = new Uint8Array(MT * MT);
const variant = new Uint8Array(MT * MT);
for (let y = 0; y < MT; y++) for (let x = 0; x < MT; x++){
  const mx = x % P, my = y % P;
  let g;
  if (mx < 3 || my < 3) g = G_ROAD;
  else if (mx === 3 || mx === 13 || my === 3 || my === 13) g = G_WALK;
  else g = G_CONC;
  ground[y * MT + x] = g;
  variant[y * MT + x] = (rnd() * 3) | 0;
}

const buildings = [], trees = [], parked = [], lotLines = [], solids = [];
const ROOFS = ["#6b6f78","#8a7d6b","#5d6b5f","#7a5f5f","#4f5a6e","#9a9488","#6e6253","#5a5560","#7d7f6a","#8b6e5a"];
const CARCOLS = ["#c0392b","#2980b9","#27ae60","#f1c40f","#ecf0f1","#2c3e50","#8e44ad","#d35400","#7f8c8d","#16a085","#1a1a1a","#b8b8b8"];

function setBlockGround(bx, by, fn){
  for (let y = 4; y <= 12; y++) for (let x = 4; x <= 12; x++)
    ground[(by * P + y) * MT + bx * P + x] = fn(x, y);
}

function addBuilding(x, y, w, h){
  const col = ROOFS[(rnd() * ROOFS.length) | 0];
  const ht = rr(0.12, 0.42);
  const det = [];
  if (w > 56 && h > 56){
    const n = (rnd() * 4) | 0;
    for (let i = 0; i < n; i++){
      const dw = rr(10, 22), dh = rr(10, 22);
      det.push([rr(8, w - dw - 8), rr(8, h - dh - 8), dw, dh]);
    }
  }
  buildings.push({ x, y, w, h, ht, col, wall: shade(col, -0.32), wall2: shade(col, -0.5),
    edge: shade(col, 0.14), det: det, detCol: shade(col, -0.2) });
  solids.push({ t: "r", x, y, w, h });
}

function splitB(x, y, w, h, d){
  if (d >= 3 || (d >= 1 && rnd() < 0.35) || w < 130 || h < 130){
    addBuilding(x + 5, y + 5, w - 10, h - 10);
    return;
  }
  if (w >= h){ const s = w * rr(0.35, 0.65); splitB(x, y, s, h, d + 1); splitB(x + s, y, w - s, h, d + 1); }
  else       { const s = h * rr(0.35, 0.65); splitB(x, y, w, s, d + 1); splitB(x, y + s, w, h - s, d + 1); }
}

function addParkedCar(cx, cy, ang){
  const horiz = Math.abs(Math.cos(ang)) > 0.5;
  const w = horiz ? 44 : 22, h = horiz ? 22 : 44;
  const o = { t: "r", x: cx - w / 2, y: cy - h / 2, w, h };
  solids.push(o);
  parked.push({ x: cx, y: cy, a: ang, col: CARCOLS[(rnd() * CARCOLS.length) | 0] });
}

const S = 9 * T; // wnętrze kwartału
for (let by = 0; by < NB; by++) for (let bx = 0; bx < NB; bx++){
  const X0 = (bx * P + 4) * T, Y0 = (by * P + 4) * T;
  const r = rnd();
  if (r < 0.17){
    // PARK
    setBlockGround(bx, by, (x, y) => (x === 8 || y === 8) ? G_WALK : G_GRASS);
    const n = 9 + ((rnd() * 7) | 0);
    for (let i = 0; i < n; i++){
      const x = rr(X0 + 22, X0 + S - 22), y = rr(Y0 + 22, Y0 + S - 22);
      if (Math.abs(x - (X0 + S / 2)) < 44 || Math.abs(y - (Y0 + S / 2)) < 44) continue;
      const tr = rr(14, 24);
      trees.push({ x, y, r: tr });
      solids.push({ t: "c", x, y, r: tr * 0.45 });
    }
  } else if (r < 0.27){
    // PARKING
    setBlockGround(bx, by, () => G_LOT);
    const rows = [Y0 + 38, Y0 + S / 2 - 24, Y0 + S / 2 + 24, Y0 + S - 38];
    for (let ri = 0; ri < rows.length; ri++){
      const cy = rows[ri];
      for (let i = 0; i < 11; i++){
        const sx = X0 + 30 + i * 34;
        lotLines.push([sx - 17, cy - 24, 2, 48]);
        if (rnd() < 0.55) addParkedCar(sx, cy, (ri % 2 === 0) ? -Math.PI / 2 : Math.PI / 2);
      }
      lotLines.push([X0 + 30 + 11 * 34 - 17, cy - 24, 2, 48]);
    }
  } else {
    // BUDYNKI
    splitB(X0, Y0, S, S, 0);
  }
}

// auta zaparkowane przy krawężnikach
for (let r = 0; r <= NB; r++){
  const y0 = r * P * T;
  for (let k = 0; k < NB; k++){
    const xs = (k * P + 3) * T + 34, xe = ((k + 1) * P) * T - 34;
    for (const side of [0, 1]){
      let x = xs + rr(0, 60);
      while (x < xe - 44){
        if (rnd() < 0.3){ addParkedCar(x + 22, side ? y0 + 3 * T - 14 : y0 + 14, side ? 0 : Math.PI); x += rr(60, 150); }
        else x += rr(40, 110);
      }
    }
  }
}
for (let c = 0; c <= NB; c++){
  const x0 = c * P * T;
  for (let k = 0; k < NB; k++){
    const ys = (k * P + 3) * T + 34, ye = ((k + 1) * P) * T - 34;
    for (const side of [0, 1]){
      let y = ys + rr(0, 60);
      while (y < ye - 44){
        if (rnd() < 0.3){ addParkedCar(side ? x0 + 3 * T - 14 : x0 + 14, y + 22, side ? Math.PI / 2 : -Math.PI / 2); y += rr(60, 150); }
        else y += rr(40, 110);
      }
    }
  }
}

buildings.sort((a, b) => a.ht - b.ht);

// siatka przestrzenna do kolizji
const C = 192, GW = Math.ceil(WORLD / C);
const grid = Array.from({ length: GW * GW }, () => []);
for (const o of solids){
  let x0, y0, x1, y1;
  if (o.t === "r"){ x0 = o.x; y0 = o.y; x1 = o.x + o.w; y1 = o.y + o.h; }
  else { x0 = o.x - o.r; y0 = o.y - o.r; x1 = o.x + o.r; y1 = o.y + o.r; }
  for (let cy = clamp((y0 / C) | 0, 0, GW - 1); cy <= clamp((y1 / C) | 0, 0, GW - 1); cy++)
    for (let cx = clamp((x0 / C) | 0, 0, GW - 1); cx <= clamp((x1 / C) | 0, 0, GW - 1); cx++)
      grid[cy * GW + cx].push(o);
}

// minimapa
const mm = document.createElement("canvas");
mm.width = mm.height = MT * 2;
(function(){
  const m = mm.getContext("2d");
  const cols = ["#5a5d63", "#7c7e7a", "#3f7a3a", "#3b3d42", "#45474c"];
  for (let y = 0; y < MT; y++) for (let x = 0; x < MT; x++){
    m.fillStyle = cols[ground[y * MT + x]];
    m.fillRect(x * 2, y * 2, 2, 2);
  }
  m.fillStyle = "#26282d";
  for (const b of buildings) m.fillRect(b.x / T * 2, b.y / T * 2, b.w / T * 2, b.h / T * 2);
})();

// ================== AUTO GRACZA ==================
const SPAWN = { x: (P * 2 + 1.5) * T, y: (P * 2 + 1.5) * T, a: 0 };
const car = { x: SPAWN.x, y: SPAWN.y, a: 0, vx: 0, vy: 0, steer: 0, slip: 0, braking: false, col: "#e8a317" };
function respawn(){ car.x = SPAWN.x; car.y = SPAWN.y; car.a = 0; car.vx = car.vy = 0; car.steer = 0; }

// ================== STEROWANIE ==================
const keys = {};
const touch = { gas: false, brake: false, hb: false, steer: 0 };
const inp = { thr: false, brk: false, hb: false, steer: 0 };

addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyR") respawn();
  if (e.code === "KeyM") toggleMute();
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => { keys[e.code] = false; });
document.addEventListener("contextmenu", e => e.preventDefault());

function readInput(){
  const kL = keys.ArrowLeft || keys.KeyA, kR = keys.ArrowRight || keys.KeyD;
  inp.thr = !!(keys.ArrowUp || keys.KeyW || touch.gas);
  inp.brk = !!(keys.ArrowDown || keys.KeyS || touch.brake);
  inp.hb = !!(keys.Space || touch.hb);
  inp.steer = (kL || kR) ? (kR ? 1 : 0) - (kL ? 1 : 0) : touch.steer;
}

const stick = document.getElementById("stick"), knob = document.getElementById("knob");
let stickId = null, stickCx = 0;
function moveStick(px){
  const max = 58;
  let d = clamp(px - stickCx, -max, max);
  knob.style.transform = "translateX(" + d + "px)";
  let v = d / max;
  touch.steer = Math.abs(v) < 0.08 ? 0 : v;
}
stick.addEventListener("pointerdown", e => {
  e.preventDefault(); stickId = e.pointerId;
  try { stick.setPointerCapture(e.pointerId); } catch(_){}
  const r = stick.getBoundingClientRect(); stickCx = r.left + r.width / 2;
  moveStick(e.clientX);
});
stick.addEventListener("pointermove", e => { if (e.pointerId === stickId) moveStick(e.clientX); });
function endStick(e){ if (e.pointerId === stickId){ stickId = null; touch.steer = 0; knob.style.transform = "translateX(0)"; } }
stick.addEventListener("pointerup", endStick);
stick.addEventListener("pointercancel", endStick);
stick.addEventListener("lostpointercapture", endStick);

function bindBtn(id, key){
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    touch[key] = true; el.classList.add("on");
    if (navigator.vibrate) navigator.vibrate(8);
  });
  const off = () => { touch[key] = false; el.classList.remove("on"); };
  ["pointerup","pointercancel","lostpointercapture"].forEach(t => el.addEventListener(t, off));
}
bindBtn("gas", "gas"); bindBtn("brake", "brake"); bindBtn("hb", "hb");

// ================== DŹWIĘK ==================
let actx = null, master, engGain, eng1, eng2, filt, skidGain, noiseBuf, muted = false, crashCd = 0;
function initAudio(){
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 1; master.connect(actx.destination);
    eng1 = actx.createOscillator(); eng1.type = "sawtooth";
    eng2 = actx.createOscillator(); eng2.type = "square";
    filt = actx.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = 500;
    const g2 = actx.createGain(); g2.gain.value = 0.45;
    engGain = actx.createGain(); engGain.gain.value = 0;
    eng1.connect(filt); eng2.connect(g2); g2.connect(filt); filt.connect(engGain); engGain.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = actx.createBufferSource(); noise.buffer = noiseBuf; noise.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 4;
    skidGain = actx.createGain(); skidGain.gain.value = 0;
    noise.connect(bp); bp.connect(skidGain); skidGain.connect(master);
    eng1.start(); eng2.start(); noise.start();
  } catch (e) { actx = null; }
}
function toggleMute(){
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
  if (master) master.gain.value = muted ? 0 : 1;
}
document.getElementById("muteBtn").addEventListener("click", toggleMute);
document.getElementById("resetBtn").addEventListener("click", respawn);
document.addEventListener("visibilitychange", () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else actx.resume();
});

function crashSound(v){
  if (!actx || muted || crashCd > 0) return;
  crashCd = 0.25;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 650;
  const g = actx.createGain();
  g.gain.setValueAtTime(Math.min(0.9, v / 450), t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random() * 0.5); src.stop(t + 0.4);
}

let gear = 0;
function updateAudio(){
  if (!actx) return;
  const s = Math.hypot(car.vx, car.vy);
  const span = MAXF / 5;
  gear = Math.min(4, Math.floor(s / span));
  const part = (s - gear * span) / span;
  const rpm = gear === 0 ? s / span : 0.35 + 0.65 * part;
  const freq = 42 + rpm * 115 + gear * 6;
  const t = actx.currentTime;
  eng1.frequency.setTargetAtTime(freq, t, 0.05);
  eng2.frequency.setTargetAtTime(freq * 0.5, t, 0.05);
  filt.frequency.setTargetAtTime(380 + rpm * 700 + (inp.thr ? 400 : 0), t, 0.08);
  engGain.gain.setTargetAtTime(started ? 0.07 + (inp.thr ? 0.07 : 0) : 0, t, 0.08);
  const sk = (car.slip > 80 && s > 40) ? Math.min(0.22, (car.slip - 80) / 900) : 0;
  skidGain.gain.setTargetAtTime(sk, t, 0.05);
}

// ================== FIZYKA ==================
let qid = 0, shake = 0;
const skids = [];
let lastSk = null;
const parts = [];

function step(dt){
  const fx = Math.cos(car.a), fy = Math.sin(car.a), rx = -fy, ry = fx;
  let vF = car.vx * fx + car.vy * fy;
  let vR = car.vx * rx + car.vy * ry;
  car.steer += (inp.steer - car.steer) * Math.min(1, dt * 9);
  let braking = false;

  if (inp.thr){
    if (vF < -15){ vF += BRAKE * dt; braking = true; }
    else vF += ACC * Math.max(0.12, 1 - vF / MAXF) * dt;
  }
  if (inp.brk){
    if (vF > 15){ vF -= BRAKE * dt; braking = true; }
    else if (vF > -MAXREV) vF -= REV * dt;
  }
  if (!inp.thr && !inp.brk){
    const r = 85 * dt;
    vF = Math.abs(vF) < r ? 0 : vF - Math.sign(vF) * r;
  }
  vF -= vF * 0.22 * dt;
  if (inp.hb) vF *= Math.exp(-0.9 * dt);

  const grip = inp.hb ? 1.0 : (braking && Math.abs(vF) > 250 ? 3.5 : 7.5);
  vR *= Math.exp(-grip * dt);

  car.vx = fx * vF + rx * vR;
  car.vy = fy * vF + ry * vR;

  const sf = clamp(vF / 110, -1, 1) * (1 - 0.5 * Math.min(1, Math.abs(vF) / MAXF));
  car.a += car.steer * 2.8 * sf * (inp.hb ? 1.7 : 1) * dt;

  car.x += car.vx * dt;
  car.y += car.vy * dt;
  car.slip = Math.abs(vR);
  car.braking = braking || (inp.brk && vF > 5);
  car.skidding = (Math.abs(vR) > 75) || (inp.hb && Math.abs(vF) > 80) || (braking && Math.abs(vF) > 230);

  collide();
}

function collide(){
  let impact = 0, hitX = 0, hitY = 0;
  for (const off of [13, -13]){
    let cx = car.x + Math.cos(car.a) * off, cy = car.y + Math.sin(car.a) * off;
    const r = 11;
    const gx = (cx / C) | 0, gy = (cy / C) | 0;
    qid++;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      const X = gx + dx, Y = gy + dy;
      if (X < 0 || Y < 0 || X >= GW || Y >= GW) continue;
      const cell = grid[Y * GW + X];
      for (let i = 0; i < cell.length; i++){
        const o = cell[i];
        if (o.q === qid) continue;
        o.q = qid;
        let nx, ny, pen;
        if (o.t === "c"){
          const ddx = cx - o.x, ddy = cy - o.y, d = Math.hypot(ddx, ddy), rs = r + o.r;
          if (d >= rs) continue;
          if (d > 0.001){ nx = ddx / d; ny = ddy / d; } else { nx = 1; ny = 0; }
          pen = rs - d;
        } else {
          const px = clamp(cx, o.x, o.x + o.w), py = clamp(cy, o.y, o.y + o.h);
          const ddx = cx - px, ddy = cy - py, d = Math.hypot(ddx, ddy);
          if (d >= r) continue;
          if (d > 0.001){ nx = ddx / d; ny = ddy / d; pen = r - d; }
          else {
            const dl = cx - o.x, dr = o.x + o.w - cx, dt2 = cy - o.y, db = o.y + o.h - cy;
            const m = Math.min(dl, dr, dt2, db);
            if (m === dl){ nx = -1; ny = 0; } else if (m === dr){ nx = 1; ny = 0; }
            else if (m === dt2){ nx = 0; ny = -1; } else { nx = 0; ny = 1; }
            pen = m + r;
          }
        }
        car.x += nx * pen; car.y += ny * pen; cx += nx * pen; cy += ny * pen;
        const vn = car.vx * nx + car.vy * ny;
        if (vn < 0){
          if (-vn > impact){ impact = -vn; hitX = cx - nx * r; hitY = cy - ny * r; }
          car.vx -= nx * vn * 1.3; car.vy -= ny * vn * 1.3;
          car.vx *= 0.93; car.vy *= 0.93;
          // lekki obrót przy uderzeniu
          const cross = Math.cos(car.a) * ny - Math.sin(car.a) * nx;
          car.a += cross * Math.sign(off) * Math.min(0.08, -vn / 4000);
        }
      }
    }
  }
  // granice mapy
  const m = 16;
  if (car.x < m){ car.x = m; car.vx = Math.abs(car.vx) * 0.3; }
  if (car.y < m){ car.y = m; car.vy = Math.abs(car.vy) * 0.3; }
  if (car.x > WORLD - m){ car.x = WORLD - m; car.vx = -Math.abs(car.vx) * 0.3; }
  if (car.y > WORLD - m){ car.y = WORLD - m; car.vy = -Math.abs(car.vy) * 0.3; }

  if (impact > 110){
    shake = Math.max(shake, Math.min(14, impact / 32));
    crashSound(impact);
    if (navigator.vibrate && impact > 200) navigator.vibrate(Math.min(80, impact / 6));
    const n = Math.min(14, (impact / 30) | 0);
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200;
      parts.push({ x: hitX, y: hitY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35, max: 0.35, r: 2, spark: true });
    }
  }
}

function updateFx(dt){
  crashCd = Math.max(0, crashCd - dt);
  const speed = Math.hypot(car.vx, car.vy);
  if (started && car.skidding && speed > 30){
    const fx = Math.cos(car.a), fy = Math.sin(car.a), rx = -fy, ry = fx;
    const bx = car.x - fx * 14, by = car.y - fy * 14;
    const w = [bx + rx * 8, by + ry * 8, bx - rx * 8, by - ry * 8];
    if (lastSk){
      skids.push([lastSk[0], lastSk[1], w[0], w[1]], [lastSk[2], lastSk[3], w[2], w[3]]);
      while (skids.length > 1200) skids.shift();
    }
    lastSk = w;
    if (Math.random() < 0.55){
      const side = Math.random() < 0.5 ? 0 : 2;
      parts.push({ x: w[side], y: w[side + 1], vx: (Math.random() - 0.5) * 30 - car.vx * 0.05,
        vy: (Math.random() - 0.5) * 30 - car.vy * 0.05, life: 1.1, max: 1.1, r: 7 + Math.random() * 5 });
    }
  } else lastSk = null;

  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.spark){ p.r += 14 * dt; p.vx *= 0.96; p.vy *= 0.96; }
  }
  if (parts.length > 300) parts.splice(0, parts.length - 300);
  shake *= Math.exp(-8 * dt);
}

// ================== KAMERA ==================
let camX = car.x, camY = car.y, zoom = 1;
function updateCam(dt){
  const speed = Math.hypot(car.vx, car.vy);
  const base = clamp(Math.min(W, H) / 520, 0.55, 2.2);
  const zt = base * (1 - 0.32 * Math.min(1, speed / MAXF));
  zoom += (zt - zoom) * Math.min(1, dt * 2);
  const tx = car.x + car.vx * 0.42, ty = car.y + car.vy * 0.42;
  camX += (tx - camX) * Math.min(1, dt * 4);
  camY += (ty - camY) * Math.min(1, dt * 4);
}

// ================== RYSOWANIE ==================
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
}
addEventListener("resize", resize);
resize();

const GCOL = [
  ["#3b3e43","#3b3e43","#3b3e43"],
  ["#8b8d88","#878984","#8f918c"],
  ["#3f7a3a","#3b7537","#44803e"],
  ["#76787a","#727476","#7a7c7e"],
  ["#45474c","#43454a","#47494e"]
];

function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCar(x, y, a, col, brake, player){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = "rgba(0,0,0,.35)"; rrect(-20, -8, 44, 22, 6); ctx.fill();
  ctx.fillStyle = col; rrect(-22, -11, 44, 22, 6); ctx.fill();
  ctx.fillStyle = shade(col.length === 7 ? col : "#888888", 0.18);
  rrect(-10, -8, 14, 16, 3); ctx.fill();
  ctx.fillStyle = "#1b2430";
  rrect(4, -8.5, 8, 17, 2); ctx.fill();
  rrect(-15, -8, 5, 16, 2); ctx.fill();
  ctx.fillStyle = "#fff6c0";
  ctx.fillRect(19, -9, 3, 5); ctx.fillRect(19, 4, 3, 5);
  ctx.fillStyle = brake ? "#ff2a2a" : "#7a1010";
  ctx.fillRect(-22, -9, 2.5, 5); ctx.fillRect(-22, 4, 2.5, 5);
  if (player){
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.fillRect(-22, -1.5, 44, 3);
  }
  ctx.restore();
}

function quad(x1, y1, x2, y2, x3, y3, x4, y4, col){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}

function drawBuilding(b, cx, cy){
  const k = 1 + b.ht;
  const X = cx + (b.x - cx) * k, Y = cy + (b.y - cy) * k, Wd = b.w * k, Hd = b.h * k;
  const ax = b.x, ay = b.y, bx = b.x + b.w, by = b.y + b.h;
  // cień na ziemi
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(ax + 6, ay + 8, b.w, b.h);
  if (cx < ax) quad(ax, ay, ax, by, X, Y + Hd, X, Y, b.wall2);
  if (cx > bx) quad(bx, ay, bx, by, X + Wd, Y + Hd, X + Wd, Y, b.wall2);
  if (cy < ay) quad(ax, ay, bx, ay, X + Wd, Y, X, Y, b.wall);
  if (cy > by) quad(ax, by, bx, by, X + Wd, Y + Hd, X, Y + Hd, b.wall);
  ctx.fillStyle = b.col; ctx.fillRect(X, Y, Wd, Hd);
  ctx.strokeStyle = b.edge; ctx.lineWidth = 3;
  ctx.strokeRect(X + 2, Y + 2, Wd - 4, Hd - 4);
  ctx.fillStyle = b.detCol;
  for (const d of b.det) ctx.fillRect(X + d[0] * k, Y + d[1] * k, d[2] * k, d[3] * k);
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#1a1c1f"; ctx.fillRect(0, 0, W, H);

  const sx = (Math.random() - 0.5) * shake * 2, sy = (Math.random() - 0.5) * shake * 2;
  const vx = camX + sx / zoom, vy = camY + sy / zoom;
  ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, DPR * (W / 2 - vx * zoom), DPR * (H / 2 - vy * zoom));

  const vw = W / zoom, vh = H / zoom;
  const x0 = camX - vw / 2 - 60, y0 = camY - vh / 2 - 60, x1 = camX + vw / 2 + 60, y1 = camY + vh / 2 + 60;

  // podłoże
  const tx0 = clamp(Math.floor(x0 / T), 0, MT - 1), tx1 = clamp(Math.floor(x1 / T), 0, MT - 1);
  const ty0 = clamp(Math.floor(y0 / T), 0, MT - 1), ty1 = clamp(Math.floor(y1 / T), 0, MT - 1);
  ctx.fillStyle = GCOL[0][0];
  ctx.fillRect(tx0 * T, ty0 * T, (tx1 - tx0 + 1) * T, (ty1 - ty0 + 1) * T);
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++){
    const i = y * MT + x, g = ground[i];
    if (g === G_ROAD) continue;
    ctx.fillStyle = GCOL[g][variant[i]];
    ctx.fillRect(x * T, y * T, T + 0.6, T + 0.6);
  }

  // krawężniki
  ctx.strokeStyle = "#b5b6b0"; ctx.lineWidth = 3;
  for (let by = 0; by < NB; by++) for (let bx = 0; bx < NB; bx++){
    const X = (bx * P + 3) * T, Y = (by * P + 3) * T, Sz = 11 * T;
    if (X > x1 || Y > y1 || X + Sz < x0 || Y + Sz < y0) continue;
    ctx.strokeRect(X, Y, Sz, Sz);
  }

  // oznakowanie dróg
  ctx.strokeStyle = "rgba(240,240,230,.75)"; ctx.lineWidth = 3;
  ctx.setLineDash([22, 22]);
  ctx.beginPath();
  for (let r = 0; r <= NB; r++){
    const c = (r * P + 1.5) * T;
    for (let k = 0; k < NB; k++){
      const s = (k * P + 3) * T + 44, e = ((k + 1) * P) * T - 44;
      if (c > y0 && c < y1 && e > x0 && s < x1){ ctx.moveTo(s, c); ctx.lineTo(e, c); }
      if (c > x0 && c < x1 && e > y0 && s < y1){ ctx.moveTo(c, s); ctx.lineTo(c, e); }
    }
  }
  ctx.stroke();
  ctx.setLineDash([]);
  // przejścia dla pieszych
  ctx.fillStyle = "rgba(240,240,230,.8)";
  for (let r = 0; r <= NB; r++){
    const rs = r * P * T;
    for (let k = 0; k < NB; k++){
      const s = (k * P + 3) * T, e = ((k + 1) * P) * T;
      if (rs < y1 && rs + 3 * T > y0){
        if (s + 30 > x0 && s < x1) for (let i = 0; i < 10; i++) ctx.fillRect(s + 6, rs + 6 + i * 13.5, 24, 7);
        if (e > x0 && e - 30 < x1) for (let i = 0; i < 10; i++) ctx.fillRect(e - 30, rs + 6 + i * 13.5, 24, 7);
      }
      if (rs < x1 && rs + 3 * T > x0){
        if (s + 30 > y0 && s < y1) for (let i = 0; i < 10; i++) ctx.fillRect(rs + 6 + i * 13.5, s + 6, 7, 24);
        if (e > y0 && e - 30 < y1) for (let i = 0; i < 10; i++) ctx.fillRect(rs + 6 + i * 13.5, e - 30, 7, 24);
      }
    }
  }
  // linie parkingowe
  ctx.fillStyle = "rgba(230,230,220,.6)";
  for (const l of lotLines){
    if (l[0] > x1 || l[1] > y1 || l[0] + l[2] < x0 || l[1] + l[3] < y0) continue;
    ctx.fillRect(l[0], l[1], l[2], l[3]);
  }

  // ślady opon
  if (skids.length){
    ctx.strokeStyle = "rgba(15,15,15,.42)"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath();
    for (const s of skids){
      if (s[2] < x0 || s[2] > x1 || s[3] < y0 || s[3] > y1) continue;
      ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]);
    }
    ctx.stroke();
  }

  // dym
  for (const p of parts){
    if (p.spark) continue;
    ctx.fillStyle = "rgba(210,210,210," + (0.35 * p.life / p.max).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }

  // zaparkowane auta
  for (const c of parked){
    if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
    drawCar(c.x, c.y, c.a, c.col, false, false);
  }

  // gracz
  drawCar(car.x, car.y, car.a, car.col, car.braking, true);

  // iskry
  for (const p of parts){
    if (!p.spark) continue;
    ctx.fillStyle = "rgba(255," + (180 + (Math.random() * 60) | 0) + ",60," + (p.life / p.max).toFixed(2) + ")";
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }

  // drzewa
  for (const t of trees){
    if (t.x < x0 - 40 || t.x > x1 + 40 || t.y < y0 - 40 || t.y > y1 + 40) continue;
    const k = 1.1, X = camX + (t.x - camX) * k, Y = camY + (t.y - camY) * k;
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath(); ctx.arc(t.x + 5, t.y + 7, t.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2c6629";
    ctx.beginPath(); ctx.arc(X, Y, t.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3d8a38";
    ctx.beginPath(); ctx.arc(X - t.r * 0.25, Y - t.r * 0.25, t.r * 0.6, 0, Math.PI * 2); ctx.fill();
  }

  // budynki
  for (const b of buildings){
    if (b.x > x1 + 220 || b.y > y1 + 220 || b.x + b.w < x0 - 220 || b.y + b.h < y0 - 220) continue;
    drawBuilding(b, camX, camY);
  }

  drawHUD();
}

function drawHUD(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!started) return;
  const speed = Math.hypot(car.vx, car.vy) / 10 * 3.6;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.font = "900 38px system-ui, sans-serif";
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillText(Math.round(speed), W / 2 + 2, 52);
  ctx.fillStyle = "#fff"; ctx.fillText(Math.round(speed), W / 2, 50);
  ctx.font = "700 12px system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.75)";
  const vF = car.vx * Math.cos(car.a) + car.vy * Math.sin(car.a);
  const g = vF < -5 ? "R" : (Math.hypot(car.vx, car.vy) < 3 ? "N" : String(gear + 1));
  ctx.fillText("km/h  ·  bieg " + g, W / 2, 68);

  // minimapa
  const sz = Math.min(130, Math.min(W, H) * 0.3);
  const mx = W - sz - 14, my = 14;
  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = "#000"; ctx.fillRect(mx - 3, my - 3, sz + 6, sz + 6);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mm, mx, my, sz, sz);
  ctx.globalAlpha = 1;
  const px = mx + car.x / WORLD * sz, py = my + car.y / WORLD * sz;
  ctx.translate(px, py); ctx.rotate(car.a);
  ctx.fillStyle = "#ffb300"; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ================== START I PĘTLA ==================
let started = false;
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
document.getElementById("hint").innerHTML = isTouch
  ? "Lewy kciuk: skręcanie · Prawy: gaz, hamulec / wsteczny, ręczny do driftu.<br>Najwygodniej trzymać telefon poziomo."
  : "Strzałki lub WASD: jazda · Spacja: ręczny · R: powrót na start · M: dźwięk";

document.getElementById("play").addEventListener("click", () => {
  initAudio();
  if (actx && actx.state === "suspended") actx.resume();
  if (isTouch){
    const el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {}); } catch(_){}
    try { screen.orientation.lock("landscape").catch(() => {}); } catch(_){}
    document.getElementById("ui").classList.add("show");
  }
  document.getElementById("start").style.display = "none";
  started = true;
});

let last = performance.now();
function frame(t){
  const dt = Math.min(0.033, (t - last) / 1000);
  last = t;
  readInput();
  if (started){ step(dt / 2); step(dt / 2); }
  updateFx(dt);
  updateCam(dt);
  render();
  updateAudio();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
